name: LeadFlow Health Probe (diagnostic)

# Temporary diagnostic. The scheduled health-check session runs in an
# environment whose egress allowlist permits GitHub only, so it cannot reach
# the production host directly (see draft PR #19 for the original version of
# this workaround, first hit 2026-08-03). A GitHub runner can. Only PUBLIC,
# unauthenticated endpoints are probed here — no credentials belong in this file.

on:
  push:
    branches: [main-outqmr]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health
        run: |
          BASE="https://leadflow-railway-production.up.railway.app"
          echo "=== GET /health ==="
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BASE/health" || echo "000")
          echo "HTTP_STATUS: $code"
          echo "BODY_START"
          cat /tmp/health.json || true
          echo ""
          echo "BODY_END"

      - name: Probe deployed bundle (deploy drift)
        run: |
          BASE="https://leadflow-railway-production.up.railway.app"
          echo "=== GET / ==="
          code=$(curl -sS -o /tmp/root.html -w "%{http_code}" --max-time 30 "$BASE/" || echo "000")
          echo "HTTP_STATUS: $code"
          echo "ASSETS:"
          grep -o '/assets/index-[A-Za-z0-9_-]*\.js' /tmp/root.html | sort -u || echo "(none found)"
          grep -o '/assets/index-[A-Za-z0-9_-]*\.css' /tmp/root.html | sort -u || true

      - name: Is the latest main commit actually live?
        run: |
          BASE="https://leadflow-railway-production.up.railway.app"
          curl -sS -o /tmp/root.html --max-time 30 "$BASE/"
          JS=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' /tmp/root.html | sort -u | head -1)
          echo "BUNDLE: $JS"
          curl -sS -o /tmp/bundle.js --max-time 60 "$BASE$JS"
          echo "BUNDLE_BYTES: $(wc -c < /tmp/bundle.js)"
          # "Untouched" (Follow-Ups overdue split) ships only in the 2026-08 batch.
          if grep -q 'Untouched' /tmp/bundle.js; then
            echo "MARKER_UNTOUCHED: PRESENT  -> Aug-02 batch is deployed"
          else
            echo "MARKER_UNTOUCHED: ABSENT   -> deployed bundle predates the Aug-02 batch"
          fi
